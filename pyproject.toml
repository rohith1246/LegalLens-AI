[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legallens-ai"
version = "2.0.0"
description = "AI Legal Copilot & Contract Intelligence Engine for PromptWars 2026"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rohith", email = "rohithvuppula@gmail.com" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
